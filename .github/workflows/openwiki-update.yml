name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.2.5 mermaid@11.16.0 jsdom@29.1.1

      - name: Verify API connectivity
        run: |
          echo "Testing API connectivity from GitHub Actions runner..."
          BASE_URL="${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}"
          API_KEY="${{ secrets.OPENAI_COMPATIBLE_API_KEY }}"
          MODEL="${{ secrets.OPENWIKI_MODEL_ID }}"
          STATUS=$(curl -s -o /tmp/api_response.json -w "%{http_code}" --max-time 30 \
            "${BASE_URL}/chat/completions" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"${MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}" \
            || echo "FAILED")
          echo "HTTP status: ${STATUS}"
          if [ "$STATUS" != "200" ]; then
            echo "API connectivity check failed! Response:"
            cat /tmp/api_response.json
            echo ""
            echo "The API endpoint may not be accessible from GitHub Actions runners."
            exit 1
          fi
          echo "API is reachable and responding correctly."

      - name: Run OpenWiki
        timeout-minutes: 15
        run: openwiki code --update --print --language zh-CN
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
          OPENWIKI_MODEL_ID: ${{ secrets.OPENWIKI_MODEL_ID }}

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
