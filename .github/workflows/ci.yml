name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MoonBit
        uses: moonbitlang/setup-moonbit@v1

      - name: Build
        run: mbt build

      - name: Test
        run: mbt test
